# Distro package routes for scripts/pre-reqs.sh.
#
# Format, pipe-separated:
#   <os-release IDs, space separated> | <package manager> | <packages>
#
# The first line whose IDs match ID or ID_LIKE from /etc/os-release wins.
# Supported package managers: pacman, apt, dnf, zypper.
# "a/b" means: install the first of a or b that the repositories offer.
#
# gpu-screen-recorder is packaged on Arch and openSUSE. On Fedora pre-reqs.sh
# offers a COPR; everywhere else it prints build instructions.

