# Distro package routes for scripts/pre-reqs.sh.
#
# Format, pipe-separated:
#   <os-release IDs, space separated> | <install command> | <packages>
#
# The first line whose IDs match ID or ID_LIKE from /etc/os-release wins.
# gpu-screen-recorder is only packaged on Arch-family distros; everywhere
# else pre-reqs.sh prints manual install instructions after verifying.

arch archlinux manjaro endeavouros cachyos garuda | sudo pacman -S --needed | cmake gcc go gpu-screen-recorder qt6-base qt6-declarative qt6-multimedia ffmpeg libpulse
debian ubuntu linuxmint pop elementary | sudo apt-get install -y | cmake g++ golang-go qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qml6-module-qtquick qml6-module-qtquick-controls ffmpeg pulseaudio-utils
fedora rhel centos | sudo dnf install -y | cmake gcc-c++ golang qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel ffmpeg pulseaudio-utils
opensuse opensuse-tumbleweed opensuse-leap suse | sudo zypper install | cmake gcc-c++ go qt6-base-devel qt6-declarative-devel qt6-multimedia-devel ffmpeg pulseaudio-utils
